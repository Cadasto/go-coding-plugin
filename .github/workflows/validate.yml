name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.27.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      # The floor-minor (1.27.x) leg activates the validator's Fixer-column check
      # (go tool fix help is the authority for what `go fix` ships); keep that minor
      # in step with GO_FLOOR_MINOR in scripts/validate.py and the documented baseline.
      # Once the next Go minor is released, add it as a second leg: it proves the plugin
      # also validates there, and its Fixer-column check soft-skips (a note, not a failure).
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: false   # no go.mod — nothing to cache
      # CI is strict and deterministic: Python is guaranteed here, so run the
      # validator directly (the scripts/validate.sh graceful skip is for local use).
      - run: python3 scripts/validate.py
      # A green validator proves the tree is valid, not that the checks still check.
      - run: python3 scripts/validate.py --selftest
      # Bash-only hook test harness; runs on every matrix leg.
      - run: ./scripts/hooks-test.sh
      # The gosym helper against a stub gopls: no Go toolchain or gopls needed.
      - run: ./scripts/gosym-test.sh
